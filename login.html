<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase Core FIRST -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>

    <!-- THEN Auth / Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #ecfdf5, #f1f5f9);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-xl shadow-emerald-100/50 mb-6 border border-emerald-50">
                <img src="../img/nro-logo.png" alt="NRO Logo" class="w-14 h-14 object-contain">
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Admin Portal</h1>
            <p class="text-slate-500 mt-2">Northern Reform Organization</p>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </span>
                        <input id="username" type="text" placeholder="Enter username"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input id="password" type="password" placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>
                </div>

                <div id="error"
                    class="hidden flex items-center gap-2 text-red-600 bg-red-50 p-3 rounded-lg text-sm border border-red-100">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span>Invalid username or password</span>
                </div>

                <button onclick="login()" id="loginBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex justify-end">
                <a href="#" onclick="forgotPassword()"
                    class="text-sm font-medium text-emerald-600 hover:text-emerald-700 hover:underline">
                    Forgot password?
                </a>
            </div>
        </div>


        <p class="text-center text-slate-400 text-xs mt-8">
            &copy; 2026 Northern Reform Organization. <br> Authorized Access Only.
        </p>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyCcgOXXqYsT7Bw7_YFllMyHK57yEbafB0U",
            authDomain: "nro-portal.firebaseapp.com",
            projectId: "nro-portal",
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        async function login() {
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('error');

            btn.innerHTML = `<span>Authenticating...</span>`;
            btn.disabled = true;

            try {
                await auth.signInWithEmailAndPassword(email, password);

                // Firebase handles session automatically
                window.location.href = "dashboard.html";

            } catch (err) {
                error.classList.remove('hidden');
                btn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" class="w-5 h-5"></i>`;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function forgotPassword() {
            const email = document.getElementById('username').value;
            const errorDiv = document.getElementById('error'); // Reuse your existing error div

            if (!email) {
                errorDiv.classList.remove('hidden');
                errorDiv.querySelector('span').innerText = "Please enter your email to reset.";
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert("Check your email for the reset link.");
                })
                .catch((error) => {
                    errorDiv.classList.remove('hidden');
                    errorDiv.querySelector('span').innerText = "Error: " + error.message;
                });
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>

</body>

</html>
